<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
    <title>2048</title>
</head>

<body>
    <div class="ui-shell">
        <div class="ui-window">
            <header class="ui-window__header">
                <div>
                    <h1 class="ui-window__title">2048</h1>
                    <p class="ui-window__subtitle">合成 2048 获胜</p>
                </div>
                <button class="ui-btn ui-btn--primary" id="new-game-btn">新游戏</button>
            </header>

            <div class="ui-window__body">
                <div class="ui-stats">
                    <div class="ui-stat">
                        <span class="ui-stat__label">分数</span>
                        <span class="ui-stat__value" id="score">0</span>
                    </div>
                    <div class="ui-stat">
                        <span class="ui-stat__label">最高分</span>
                        <span class="ui-stat__value" id="best-score">0</span>
                    </div>
                </div>

                <div class="board-2048">
                    <div class="board-2048__grid" id="grid-bg"></div>
                    <div class="board-2048__tiles" id="tile-container"></div>
                </div>

                <p class="board-2048__hint">使用方向键或滑动屏幕移动方块</p>
            </div>

            <footer class="ui-window__footer">
                相同数字合并，合成 2048 获胜
            </footer>
        </div>
    </div>

    <div class="ui-modal" id="game-message">
        <div class="ui-modal__content">
            <h2 class="ui-modal__title" id="game-message-title">游戏结束</h2>
            <p class="ui-modal__desc" id="game-message-desc"></p>
            <div class="ui-modal__actions">
                <button class="ui-btn ui-btn--primary" id="retry-btn">再试一次</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/games/2048/main.ts"></script>
</body>

</html>
