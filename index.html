<body>
    <header>
        <div class="container header-inner">
            <i class="fa fa-gamepad header-icon"></i>
            <h1 class="header-title">
                <span>小游戏</span>中心
            </h1>
        </div>
    </header>
    <main class="container">
        <div class="page-desc">
            <h2>精选<span>多款</span>小游戏 · 即点即玩</h2>
            <p>无需下载，打开浏览器就能玩，轻松享受游戏乐趣</p>
        </div>
        <div class="wrap">
            <div class="box-group">
                <div class="filter-card difficulty-card">
                    <h3>按难度筛选</h3>
                    <div class="inner-grid">
                        <button class="btn active" data-diff="all">

                        </button>
                        <button class="btn btn-type1" data-diff="easy">
                            <div>0</div>
                            <div>简单</div>
                        </button>
                        <button class="btn btn-type2" data-diff="mid">
                            <div>0</div>
                            <div>中等</div>
                        </button>
                        <button class="btn btn-type3" data-diff="hard">
                            <div>0</div>
                            <div>困难</div>
                        </button>
                    </div>
                </div>
                <div class="filter-card category-card">
                    <h3>按类别筛选</h3>
                    <div class="inner-grid">
                        <button class="btn active" data-cate="all">
                            <div>0</div>
                            <div>所有分类</div>
                        </button>
                        <button class="btn btn-type5" data-cate="logic">
                            <div>0</div>

                        </button>
                        <button class="btn btn-type1" data-cate="path">
                            <div>0</div>
                            <div>路径连接</div>
                        </button>
                        <button class="btn btn-type9" data-cate="area">
                            <div>0</div>
                            <div>区域划分</div>
                        </button>
                        <button class="btn btn-type6" data-cate="num">
                            <div>0</div>
                            <div>数字游戏</div>
                        </button>
                        <button class="btn btn-type7" data-cate="fill">
                            <div>0</div>
                            <div>图案填充</div>
                        </button>
                        <button class="btn btn-type8" data-cate="move">
                            <div>0</div>
                            <div>移动策略</div>
                        </button>
                        <button class="btn btn-type9" data-cate="special">
                            <div>0</div>
                            <div>特殊谜题</div>
                        </button>
                        <button class="btn btn-type3" data-cate="qi">
                            <div>0</div>
                            <div>棋类游戏</div>
                        </button>
                        <button class="btn btn-type5" data-cate="rea">
                            <div>0</div>
                            <div>反应训练</div>
                        </button>
                        <button class="btn btn-type1" data-cate="fun">

                            <div>趣味游戏</div>

                    </div>
                </div>
            </div>
        </div>
        <hr style="margin: 10px;">
        <div class="game-grid"></div>
    </main>
    <footer>
        <div class="container footer-inner">
            <p class="footer-copy">小游戏中心 © 2026 保留所有权利</p>
            <p class="footer-desc">本站提供免费在线小游戏，无需注册，即点即玩</p>
            <p class="footer-sitemap"><a href="" rel="sitemap">站点地图</a></p>
        </div>
    </footer>
    <script src="./data.js"></script>
    <script>
        let filterState = {
            diff: "all",
            cate: "all"
        };
        function refreshCountNumber() {
            const diffCount = {
                all: gameList.length,
                easy: gameList.filter(g => g.difficulty === "easy").length,
                mid: gameList.filter(g => g.difficulty === "mid").length,
                hard: gameList.filter(g => g.difficulty === "hard").length
            };
            document.querySelectorAll(".difficulty-card .btn").forEach(btn => {
                const diffKey = btn.dataset.diff;
                btn.querySelector("div:first-child").innerText = diffCount[diffKey];
            });
            const cateCount = {
                all: gameList.length,
                logic: gameList.filter(g => g.category === "logic").length,
                path: gameList.filter(g => g.category === "path").length,
                area: gameList.filter(g => g.category === "area").length,
                num: gameList.filter(g => g.category === "num").length,
                fill: gameList.filter(g => g.category === "fill").length,
                move: gameList.filter(g => g.category === "move").length,
                special: gameList.filter(g => g.category === "special").length,
                fun: gameList.filter(g => g.category === "fun").length,
                qi: gameList.filter(g => g.category === "qi").length,
                rea: gameList.filter(g => g.category === "rea").length
            };
            document.querySelectorAll(".category-card .btn").forEach(btn => {
                const cateKey = btn.dataset.cate;
                btn.querySelector("div:first-child").innerText = cateCount[cateKey];
            });
        }
        function renderGames() {
            const gridWrap = document.querySelector(".game-grid");
            gridWrap.innerHTML = "";
            const fragment = document.createDocumentFragment();
            const filterGames = gameList.filter(item => {
                const diffMatch = filterState.diff === "all" || item.difficulty === filterState.diff;
                const cateMatch = filterState.cate === "all" || item.category === filterState.cate;
                return diffMatch && cateMatch;
            });
            if (filterGames.length === 0) {
                gridWrap.innerHTML = `<div class="empty-tip">暂无匹配的小游戏，换个筛选条件试试</div>`;
                return;
            }
            filterGames.forEach(game => {
                const a = document.createElement("a");
                a.className = "game-item";
                a.href = game.link;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.title = game.name + " - 免费在线玩";
                const coverBox = document.createElement("div");
                coverBox.className = "game-cover-box";
                const img = document.createElement("img");
                img.className = "game-cover";
                img.src = game.img;
                img.alt = game.name + " 封面图";
                const textWrap = document.createElement("div");
                textWrap.className = "game-text";
                const nameP = document.createElement("p");
                nameP.className = "game-name";
                nameP.innerText = game.name;
                coverBox.appendChild(img);
                textWrap.appendChild(nameP);
                a.appendChild(coverBox);
                a.appendChild(textWrap);
                fragment.appendChild(a);
            });
            gridWrap.appendChild(fragment);
        }
        function setActiveBtn(containerSelector, attr, value) {
            const btns = document.querySelectorAll(`${containerSelector} .btn`);
            btns.forEach(btn => {
                if (btn.getAttribute(attr) === value) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
        }
        function bindFilterEvent() {
            document.querySelectorAll(".difficulty-card .btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    filterState.diff = btn.dataset.diff;
                    setActiveBtn(".difficulty-card", "data-diff", filterState.diff);
                    renderGames();
                })
            })
            document.querySelectorAll(".category-card .btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    filterState.cate = btn.dataset.cate;
                    setActiveBtn(".category-card", "data-cate", filterState.cate);
                    renderGames();
                })
            })
        }
        document.addEventListener("DOMContentLoaded", () => {
            refreshCountNumber();
            renderGames();
            bindFilterEvent();
        })
    </script>
</body>

</html>
