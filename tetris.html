<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
    <title>俄罗斯方块</title>
</head>

<body>
    <div class="ui-shell">
        <div class="ui-window tetris-window">
            <header class="ui-window__header">
                <div>
                    <h1 class="ui-window__title">俄罗斯方块</h1>
                    <p class="ui-window__subtitle">消除整行得分</p>
                </div>
                <div class="tetris-header-actions">
                    <button class="ui-btn" id="pauseBtn" disabled>暂停</button>
                    <button class="ui-btn ui-btn--primary" id="startBtn">开始</button>
                </div>
            </header>

            <div class="ui-window__body tetris-body">
                <div class="tetris-main">
                    <aside class="tetris-side tetris-side--stats">
                        <div class="ui-stat">
                            <span class="ui-stat__label">分数</span>
                            <span class="ui-stat__value" id="score">0</span>
                        </div>
                        <div class="ui-stat">
                            <span class="ui-stat__label">等级</span>
                            <span class="ui-stat__value" id="level">1</span>
                        </div>
                        <div class="ui-stat">
                            <span class="ui-stat__label">行数</span>
                            <span class="ui-stat__value" id="lines">0</span>
                        </div>
                    </aside>

                    <div class="tetris-board">
                        <canvas id="gameCanvas" width="300" height="600"></canvas>
                    </div>

                    <aside class="tetris-side tetris-side--info">
                        <div class="tetris-next">
                            <span class="ui-stat__label">下一个</span>
                            <canvas id="nextCanvas" width="100" height="100"></canvas>
                        </div>
                        <div class="tetris-help">
                            <p>← → 移动</p>
                            <p>↑ 旋转</p>
                            <p>↓ 加速</p>
                            <p>空格 硬降</p>
                            <p>P 暂停</p>
                        </div>
                    </aside>
                </div>

                <div class="tetris-touch" id="touchControls" hidden>
                    <button class="tetris-touch__btn" data-action="left" aria-label="左移">←</button>
                    <button class="tetris-touch__btn" data-action="rotate" aria-label="旋转">↻</button>
                    <button class="tetris-touch__btn" data-action="right" aria-label="右移">→</button>
                    <button class="tetris-touch__btn" data-action="down" aria-label="下移">↓</button>
                    <button class="tetris-touch__btn tetris-touch__btn--wide" data-action="drop">落下</button>
                </div>
            </div>
        </div>
    </div>

    <div class="ui-modal" id="gameOverModal">
        <div class="ui-modal__content">
            <h2 class="ui-modal__title">游戏结束</h2>
            <p class="ui-modal__desc">最终得分 <strong id="finalScore">0</strong></p>
            <div class="ui-modal__actions">
                <button class="ui-btn ui-btn--primary" id="playAgainBtn">再玩一次</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/games/tetris/main.ts"></script>
</body>

</html>
