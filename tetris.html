<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="tetris.css">
</head>
<body>
    <div class="game-container">
        <div class="game-info">
            <h1>俄罗斯方块</h1>
            <div class="info-panel">
                <div class="info-item">
                    <span class="label">分数:</span>
                    <span id="score">0</span>
                </div>
                <div class="info-item">
                    <span class="label">等级:</span>
                    <span id="level">1</span>
                </div>
                <div class="info-item">
                    <span class="label">消除行数:</span>
                    <span id="lines">0</span>
                </div>
            </div>
            
            <div class="next-piece">
                <div class="label">下一个:</div>
                <canvas id="nextCanvas" width="100" height="100"></canvas>
            </div>

            <div class="controls">
                <div class="control-btn" id="startBtn">开始游戏</div>
                <div class="control-btn" id="pauseBtn">暂停</div>
                <div class="control-btn" id="restartBtn">重新开始</div>
            </div>

            <div class="instructions">
                <h3>操作说明:</h3>
                <p>← → 左右移动</p>
                <p>↑ 旋转</p>
                <p>↓ 加速下落</p>
                <p>空格 直接落下</p>
                <p>P 暂停/继续</p>
            </div>
        </div>

        <div class="game-board">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
        </div>
    </div>

    <!-- 游戏结束模态框 -->
    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2>游戏结束!</h2>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button class="btn" id="playAgainBtn">再玩一次</button>
        </div>
    </div>

    <script src="tetris.js"></script>
</body>
</html>
