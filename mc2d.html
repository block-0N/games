<!DOCTYPE html>
<html lang="zh-CN">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <meta name="theme-color" content="#87ceeb" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#2a3a4a" media="(prefers-color-scheme: dark)">
        <title>MC2D</title>
</head>

<body>
        <div class="mc2d-app">
                <header class="mc2d-hud">
                        <div class="mc2d-hud__row">
                                <span class="mc2d-hud__label">生命</span>
                                <div class="mc2d-bar" id="health-bar"></div>
                        </div>
                        <div class="mc2d-hud__row">
                                <span class="mc2d-hud__label">饥饿</span>
                                <div class="mc2d-bar" id="hunger-bar"></div>
                        </div>
                        <div class="mc2d-hud__spacer"></div>
                        <button class="ui-btn" id="backpack-btn" title="打开背包 (E)">🎒 背包</button>
                        <button class="ui-btn" id="pause-btn">暂停</button>
                        <button class="ui-btn ui-btn--primary" id="restart-btn">重新开始</button>
                </header>

                <main class="mc2d-stage">
                        <canvas id="game-canvas"></canvas>
                </main>

                <footer class="mc2d-hotbar" id="hotbar">
                        <div class="mc2d-slot is-active"><span class="mc2d-slot__key">1</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">2</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">3</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">4</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">5</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">6</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">7</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">8</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                        <div class="mc2d-slot"><span class="mc2d-slot__key">9</span><span
                                        class="mc2d-slot__icon"></span><span class="mc2d-slot__count"></span></div>
                </footer>
        </div>

        <div class="mc2d-backpack" id="backpack-modal">
                <div class="mc2d-backpack__panel">
                        <header class="mc2d-backpack__header">
                                <h2 class="mc2d-backpack__title">背包</h2>
                                <button class="ui-btn" id="backpack-close">关闭</button>
                        </header>

                        <div class="mc2d-backpack__body">
                                <aside class="mc2d-backpack__player">
                                        <canvas id="player-model" width="96" height="160"></canvas>
                                        <div class="mc2d-backpack__stats">
                                                <div class="mc2d-backpack__stat">
                                                        <span class="mc2d-backpack__stat-label">生命</span>
                                                        <span class="mc2d-backpack__stat-value" id="bp-health">10</span>
                                                </div>
                                                <div class="mc2d-backpack__stat">
                                                        <span class="mc2d-backpack__stat-label">饥饿</span>
                                                        <span class="mc2d-backpack__stat-value" id="bp-hunger">10</span>
                                                </div>
                                        </div>
                                </aside>

                                <div class="mc2d-backpack__items">
                                        <!-- 合成区 -->
                                        <div class="mc2d-backpack__section-label">合成</div>
                                        <div class="mc2d-craft">
                                                <div class="mc2d-craft__grid" id="craft-grid">
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="0">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="1">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="2">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="3">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="4">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="5">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="6">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="7">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                        <div class="mc2d-bp-slot" data-source="craft" data-index="8">
                                                                <span class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span>
                                                        </div>
                                                </div>
                                                <div class="mc2d-craft__arrow">→</div>
                                                <div class="mc2d-craft__result">
                                                        <div class="mc2d-bp-slot mc2d-bp-slot--result"
                                                                data-source="craftResult" data-index="0"
                                                                id="craft-result"><span
                                                                        class="mc2d-slot__icon"></span><span
                                                                        class="mc2d-slot__count"></span></div>
                                                </div>
                                        </div>

                                        <div class="mc2d-backpack__divider"></div>

                                        <div class="mc2d-backpack__section-label">背包</div>
                                        <div class="mc2d-backpack__grid" id="backpack-grid">
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="0"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="1"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="2"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="3"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="4"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="5"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="6"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="7"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="8"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="9"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="10"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="11"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="12"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="13"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="14"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="15"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="16"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="17"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="18"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="19"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="20"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="21"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="22"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="23"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="24"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="25"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="backpack" data-index="26"><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                        </div>

                                        <div class="mc2d-backpack__divider"></div>
                                        <div class="mc2d-backpack__section-label">快捷栏</div>
                                        <div class="mc2d-backpack__grid mc2d-backpack__grid--hotbar"
                                                id="backpack-hotbar">
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="0"><span
                                                                class="mc2d-slot__key">1</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="1"><span
                                                                class="mc2d-slot__key">2</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="2"><span
                                                                class="mc2d-slot__key">3</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="3"><span
                                                                class="mc2d-slot__key">4</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="4"><span
                                                                class="mc2d-slot__key">5</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="5"><span
                                                                class="mc2d-slot__key">6</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="6"><span
                                                                class="mc2d-slot__key">7</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="7"><span
                                                                class="mc2d-slot__key">8</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                                <div class="mc2d-bp-slot" data-source="hotbar" data-index="8"><span
                                                                class="mc2d-slot__key">9</span><span
                                                                class="mc2d-slot__icon"></span><span
                                                                class="mc2d-slot__count"></span></div>
                                        </div>
                                </div>
                        </div>

                        <p class="mc2d-backpack__hint">左键拿起 · 右键拿一半 · Shift+左键快移 · 放到 3×3 合成格合成</p>
                </div>
        </div>

        <div class="mc2d-held" id="held-stack">
                <span class="mc2d-held__icon"></span>
                <span class="mc2d-held__count"></span>
        </div>

        <div class="mc2d-tooltip" id="item-tooltip">
                <strong id="tooltip-name"></strong>
                <em id="tooltip-hint"></em>
        </div>

        <div class="mc2d-game-over" id="game-over-modal">
                <div class="mc2d-game-over__panel">
                        <h2 class="mc2d-game-over__title">你倒下了</h2>
                        <p class="mc2d-game-over__desc">重新开始一局吧</p>
                        <button class="ui-btn ui-btn--primary" id="play-again-btn">再来一次</button>
                </div>
        </div>

        <script type="module" src="/src/games/mc2d/main.ts"></script>
</body>

</html>
