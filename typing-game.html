<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
    <title>打字练习</title>
</head>

<body>
    <div class="ui-shell">
        <div class="ui-window typing-window">
            <header class="ui-window__header">
                <div>
                    <h1 class="ui-window__title">打字练习</h1>
                    <p class="ui-window__subtitle">限时输入，提高速度与准确率</p>
                </div>
                <button class="ui-btn ui-btn--primary" id="start-btn">开始</button>
            </header>

            <div class="ui-window__body">
                <div class="ui-stats">
                    <div class="ui-stat">
                        <span class="ui-stat__label">时间</span>
                        <span class="ui-stat__value" id="timer">60</span>
                    </div>
                    <div class="ui-stat">
                        <span class="ui-stat__label">WPM</span>
                        <span class="ui-stat__value" id="wpm">0</span>
                    </div>
                    <div class="ui-stat">
                        <span class="ui-stat__label">准确率</span>
                        <span class="ui-stat__value" id="accuracy">100%</span>
                    </div>
                    <div class="ui-stat">
                        <span class="ui-stat__label">字符</span>
                        <span class="ui-stat__value" id="chars">0</span>
                    </div>
                </div>

                <div class="ui-segment" id="difficulty-selector">
                    <button class="ui-segment__item is-active" data-difficulty="easy">简单</button>
                    <button class="ui-segment__item" data-difficulty="medium">中等</button>
                    <button class="ui-segment__item" data-difficulty="hard">困难</button>
                </div>

                <div class="ui-segment" id="language-selector">
                    <button class="ui-segment__item is-active" data-language="random">🎲 随机</button>
                    <button class="ui-segment__item" data-language="english">英文</button>
                    <button class="ui-segment__item" data-language="chinese">中文</button>
                </div>

                <div class="typing-area" id="typing-area" tabindex="0">
                    <div class="text-display" id="text-display"></div>
                </div>

                <p class="typing-hint" id="typing-hint">点击上方文本区域开始输入</p>
            </div>

            <footer class="ui-window__footer">
                按 Backspace 回退 · 完成后自动显示成绩
            </footer>
        </div>
    </div>

    <!-- 隐藏 input：接收所有输入，包括中文输入法 -->
    <input type="text" id="hidden-input" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off"
        spellcheck="false">

    <div class="ui-modal" id="result-modal">
        <div class="ui-modal__content">
            <h2 class="ui-modal__title">🎉 练习完成</h2>
            <div class="typing-result-grid">
                <div class="typing-result-item">
                    <span class="typing-result-item__label">WPM</span>
                    <span class="typing-result-item__value" id="final-wpm">0</span>
                </div>
                <div class="typing-result-item">
                    <span class="typing-result-item__label">准确率</span>
                    <span class="typing-result-item__value" id="final-accuracy">0%</span>
                </div>
                <div class="typing-result-item">
                    <span class="typing-result-item__label">总字符</span>
                    <span class="typing-result-item__value" id="final-chars">0</span>
                </div>
                <div class="typing-result-item">
                    <span class="typing-result-item__label">错误</span>
                    <span class="typing-result-item__value" id="final-errors">0</span>
                </div>
            </div>
            <div class="ui-modal__actions">
                <button class="ui-btn" id="close-modal-btn">关闭</button>
                <button class="ui-btn ui-btn--primary" id="again-btn">再来一次</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/games/typing-game/main.ts"></script>
</body>

</html>
